<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подорожі Україною — Туристичний сайт</title>
</head>
<body>

    <header>
        <h1>Подорожі Україною</h1>
        <nav aria-label="Головне меню">
            <a href="index.html">Головна сторінка</a>
            <a href="tours.html">Каталог турів</a>
            <a href="contacts.html">Контакти</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Популярні напрямки</h2>
            

            <img src="karpaty.jpg" alt="Зелені гірські схили Карпат під синім небом">
        
            <p>
                Карпати — популярний напрямок для відпочинку.
            </p>
        </section>

        <section>
            <h2>Замовлення туру</h2>
        
            <form action="#" method="POST">
                

                <div>
                    <label window-id="name-label" for="user-name">Ваше ім'я:</label>
                    <input type="text" id="user-name" name="username" required>
                </div>
        
                <br>
        

                <div>
                    <label window-id="phone-label" for="user-phone">Телефон:</label>
                    <input type="tel" id="phone" name="phone" placeholder="+380XXXXXXXXX" required>
                </div>
        
                <br>
        

                <button type="submit">Відправити заявку</button>
        
            </form>
        </section>
    </main>

</body>
</html>

7. Тип поля телефону: Значення атрибута для поля телефону змінено, щоб відповідати типу даних.
